<title>CircuitPython Releases</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1117;color:#e2e8f0;padding:20px;min-height:100vh}
h1{text-align:center;font-size:1.35rem;color:#a78bfa;margin-bottom:4px}
.sub{text-align:center;font-size:.72rem;color:#64748b;margin-bottom:16px}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
button{padding:4px 14px;border-radius:20px;border:1.5px solid;font-size:.73rem;cursor:pointer;background:transparent;font-weight:700;transition:all .15s}
button:hover{opacity:.75}
#ball{border-color:#a78bfa;color:#a78bfa} #ball.on{background:#a78bfa;color:#0f1117}
#bst {border-color:#34d399;color:#34d399} #bst.on {background:#34d399;color:#0f1117}
#bbe {border-color:#60a5fa;color:#60a5fa} #bbe.on {background:#60a5fa;color:#0f1117}
#bal {border-color:#fb923c;color:#fb923c} #bal.on {background:#fb923c;color:#0f1117}
#brc {border-color:#facc15;color:#facc15} #brc.on {background:#facc15;color:#0f1117}
.search-wrap{text-align:center;margin-bottom:14px}
input{padding:5px 13px;background:#1e2330;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:.8rem;width:230px}
input:focus{outline:none;border-color:#a78bfa}
table{width:100%;border-collapse:collapse;font-size:.79rem}
th{background:#1a1d2e;color:#94a3b8;font-weight:600;text-align:left;padding:8px 11px;position:sticky;top:0;z-index:2;border-bottom:2px solid #334155;cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:#a78bfa}
td{padding:6px 11px;vertical-align:middle}
tr:nth-child(even){background:#0d1020}
tr:hover td{background:#1a1d2e}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:.68rem;font-weight:700}
.stable{background:#064e3b;color:#34d399}
.beta  {background:#1e3a5f;color:#60a5fa}
.alpha {background:#431407;color:#fb923c}
.rc    {background:#422006;color:#facc15}
.ver a{font-family:'Cascadia Code','Fira Code',monospace;font-weight:600;text-decoration:none;white-space:nowrap}
.num{color:#4b5563}
.date{color:#94a3b8;white-space:nowrap}
.note{color:#64748b;font-size:.73rem;max-width:280px}
.foot{text-align:center;color:#4b5563;font-size:.72rem;margin-top:10px}
.disc{text-align:center;color:#334155;font-size:.68rem;margin-top:6px}
</style>
</head>
<body>
<h1>CircuitPython Release History</h1>
<p class="sub" id="sub"></p>

<div class="filters">
  <button id="ball" class="on" onclick="setType('all')">All</button>
  <button id="bst"  onclick="setType('stable')">Stable</button>
  <button id="bbe"  onclick="setType('beta')">Beta</button>
  <button id="bal"  onclick="setType('alpha')">Alpha</button>
  <button id="brc"  onclick="setType('rc')">RC</button>
</div>
<div class="search-wrap">
  <input id="q" type="text" placeholder="Filter by version…" oninput="render()">
</div>

<table>
  <thead>
    <tr>
      <th onclick="doSort('n')"    id="hN"   >#</th>
      <th onclick="doSort('tag')"  id="hTag" >Version</th>
      <th onclick="doSort('date')" id="hDate">Date</th>
      <th onclick="doSort('type')" id="hType">Type</th>
      <th>Notes</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>
<p class="foot" id="foot"></p>
<p class="disc">Some early dates are approximate. 8.0.1, 10.1.0, 10.1.2, and several rc.0 tags were discarded per release notes.</p>

// Sort by date, assign sequence numbers
const DATA = RAW.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).map((r,i)=>({...r,n:i+1}));

let typeFilter='all', sortCol='n', sortDir=1;

function setType(t){
  typeFilter=t;
  ['all','stable','beta','alpha','rc'].forEach(x=>{
    document.getElementById('b'+x.slice(0,2)).classList.toggle('on', x===t);
  });
  // fix 'all' button id
  document.getElementById('ball').classList.toggle('on', t==='all');
  render();
}

function doSort(col){
  if(sortCol===col) sortDir*=-1; else{sortCol=col;sortDir=1;}
  ['n','tag','date','type'].forEach(c=>{
    const h=document.getElementById('h'+c.charAt(0).toUpperCase()+c.slice(1));
    if(h) h.textContent = {n:'#',tag:'Version',date:'Date',type:'Type'}[c] +
      (sortCol===c ? (sortDir===1?' ↑':' ↓') : '');
  });
  render();
}

function render(){
  const q=(document.getElementById('q').value||'').toLowerCase();
  let rows=DATA.filter(r=>{
    if(typeFilter!=='all' && r.type!==typeFilter) return false;
    if(q && !r.tag.toLowerCase().includes(q)) return false;
    return true;
  });
  rows=[...rows].sort((a,b)=>{
    const av=a[sortCol]??'', bv=b[sortCol]??'';
    return av<bv?-sortDir:av>bv?sortDir:0;
  });

  const tb=document.getElementById('tbody');
  tb.innerHTML=rows.map((r,i)=>{
    const major=parseInt(r.tag)||0;
    const col=MC[major]||'#e2e8f0';
    const bg=i%2===0?'transparent':'#0d1020';
    return `<tr style="background:${bg}">
      <td class="num">${r.n}</td>
      <td class="ver"><a href="https://github.com/adafruit/circuitpython/releases/tag/${r.tag}"
        target="_blank" style="color:${col}">${r.tag}</a></td>
      <td class="date">${r.date}</td>
      <td><span class="badge ${r.type}">${r.type}</span></td>
      <td class="note">${r.note||''}</td>
    </tr>`;
  }).join('');

  document.getElementById('foot').textContent=
    `${rows.length} of ${DATA.length} releases shown`;
}

document.getElementById('sub').textContent=
  `${DATA.length} releases · earliest → latest · Sources: GitHub, Adafruit blog`;

render();
</script>
</body>
</html>
