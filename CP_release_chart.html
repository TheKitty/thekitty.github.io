.leg { display: flex; align-items: center; gap: 5px; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
svg { display: block; margin: 0 auto; }
.axis-label { font-size: 11px; fill: #475569; }
.year-label { font-size: 11px; fill: #334155; font-weight: 600; }
.grid { stroke: #1e2330; stroke-width: 1; }
.branch-line { stroke-width: 2; opacity: .7; }
.trunk { stroke: #334155; stroke-width: 3; fill: none; }
.node { cursor: pointer; }
.node circle { stroke-width: 1.5; }
.node:hover circle { stroke-width: 3; filter: brightness(1.3); }
.tag-label { font-size: 9.5px; pointer-events: none; }
.tooltip {
  position: fixed; background: #1e2330; border: 1px solid #334155;
  border-radius: 8px; padding: 8px 12px; font-size: .75rem; pointer-events: none;
  opacity: 0; transition: opacity .15s; z-index: 99; max-width: 220px;
}
.tip-ver { color: #a78bfa; font-weight: 700; font-family: monospace; margin-bottom: 3px; }
.tip-date { color: #94a3b8; }
.tip-note { color: #64748b; margin-top: 3px; font-size: .7rem; }
</style>
</head>

// --- Layout constants ---
const PAD_LEFT = 90;   // space for year labels
const PAD_RIGHT = 20;
const PAD_TOP = 30;
const PAD_BOT = 30;
const ROW_H = 18;      // px per major version lane
const TRUNK_X = PAD_LEFT; // vertical trunk x position

// Parse releases, group by major version
const releases = RELEASES.map(r => {
  const maj = parseInt(r.tag);
  const ts = new Date(r.date).getTime();
  return { ...r, major: maj, ts };
}).sort((a, b) => a.ts - b.ts);

// Time range
const tMin = new Date("2017-01-01").getTime();
const tMax = new Date("2026-06-01").getTime();
const tRange = tMax - tMin;

// Major versions present
const majors = [...new Set(releases.map(r => r.major))].sort((a,b)=>a-b);
const numMajors = majors.length;

// SVG dimensions
const W = 900;
const laneH = 52;  // height per major version lane
const H = PAD_TOP + numMajors * laneH + PAD_BOT + 40;

// Map time → x
function tx(ts) {
  return PAD_LEFT + ((ts - tMin) / tRange) * (W - PAD_LEFT - PAD_RIGHT);
}

// Map major version → y (center of lane)
function my(major) {
  const idx = majors.indexOf(major);
  return PAD_TOP + idx * laneH + laneH / 2;
}

const svg = document.getElementById('svg');
svg.setAttribute('width', W);
svg.setAttribute('height', H);
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

function el(tag, attrs, text) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

// Background
svg.appendChild(el('rect', { x:0, y:0, width:W, height:H, fill:'#0f1117' }));

// Year grid lines
for (let y = 2017; y <= 2027; y++) {
  const x = tx(new Date(`${y}-01-01`).getTime());
  svg.appendChild(el('line', { x1:x, y1:PAD_TOP-10, x2:x, y2:H-PAD_BOT, class:'grid' }));
  svg.appendChild(el('text', { x, y:PAD_TOP-14, 'text-anchor':'middle', class:'year-label' }, y));
}

// Major version lane backgrounds + labels
majors.forEach((major, i) => {
  const cy = my(major);
  const bg = i % 2 === 0 ? '#111827' : '#0f1117';
  svg.appendChild(el('rect', { x:0, y:cy - laneH/2, width:W, height:laneH, fill:bg, opacity:'0.6' }));

  // Lane label on left
  const col = MAJOR_COLORS[major] || '#e2e8f0';
  svg.appendChild(el('text', {
    x: PAD_LEFT - 8, y: cy + 4,
    'text-anchor': 'end',
    fill: col,
    'font-size': '11',
    'font-weight': '700',
    'font-family': 'monospace'
  }, `v${major}.x`));

  // Horizontal branch line across lane
  const majorReleases = releases.filter(r => r.major === major);
  if (majorReleases.length > 0) {
    const x1 = tx(majorReleases[0].ts) - 2;
    const x2 = tx(majorReleases[majorReleases.length - 1].ts) + 2;
    svg.appendChild(el('line', {
      x1, y1: cy, x2, y2: cy,
      stroke: col, 'stroke-width': '1.5', opacity: '0.35'
    }));
  }
});

// Trunk: vertical line on left at branching point — subtle connector
// Draw vertical connectors between adjacent major version lanes at their first stable release
for (let i = 0; i < majors.length - 1; i++) {
  const mA = majors[i], mB = majors[i+1];
  const lastA = [...releases].filter(r => r.major === mA && r.type === 'stable').pop();
  const firstB = releases.filter(r => r.major === mB && r.type === 'alpha').shift()
               || releases.filter(r => r.major === mB).shift();
  if (lastA && firstB) {
    const x1 = tx(lastA.ts), y1 = my(mA);
    const x2 = tx(firstB.ts), y2 = my(mB);
    const col = MAJOR_COLORS[mB] || '#334155';
    const mid = (x1 + x2) / 2;
    svg.appendChild(el('path', {
      d: `M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`,
      stroke: col, 'stroke-width': '1', fill: 'none', opacity: '0.25'
    }));
  }
}

// Nodes — group by major and subversion to avoid stacking
// For each major, track x positions and jitter vertically if too close
releases.forEach(r => {
  const cx = tx(r.ts);
  const cy = my(r.major);

  // Offset by type within lane
  const typeOffsets = { stable: 0, rc: -10, beta: -20, alpha: -20 };
  const yOff = typeOffsets[r.type] || 0;
  const ny = cy + yOff;

  const col = TYPE_COLOR[r.type];
  const radius = r.type === 'stable' ? 5 : 3.5;

  const g = el('g', { class:'node' });

  // Connector from lane center to node
  if (yOff !== 0) {
    g.appendChild(el('line', { x1:cx, y1:cy, x2:cx, y2:ny, stroke:col, 'stroke-width':'0.7', opacity:'0.4' }));
  }

  const circle = el('circle', { cx, cy:ny, r:radius, fill:col, stroke:'#0f1117', 'stroke-width':'1.5' });
  g.appendChild(circle);

  // Tooltip on hover
  g.addEventListener('mouseenter', e => {
    const tip = document.getElementById('tip');
    tip.innerHTML = `<div class="tip-ver">${r.tag}</div><div class="tip-date">${r.date}</div>${r.note ? `<div class="tip-note">${r.note}</div>` : ''}`;
    tip.style.opacity = '1';
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top  = (e.clientY - 10) + 'px';
  });
  g.addEventListener('mousemove', e => {
    const tip = document.getElementById('tip');
    tip.style.left = (e.clientX + 12) + 'px';
    tip.style.top  = (e.clientY - 10) + 'px';
  });
  g.addEventListener('mouseleave', () => {
    document.getElementById('tip').style.opacity = '0';
  });

  svg.appendChild(g);
});

// Add a time axis line at bottom
const axisY = H - PAD_BOT + 10;
svg.appendChild(el('line', { x1:PAD_LEFT, y1:axisY, x2:W-PAD_RIGHT, y2:axisY, stroke:'#1e2330', 'stroke-width':'1' }));
</script>
</body>
</html>
